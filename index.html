<!DOCTYPE html>

<html land="en">

    <head>

        <title>Password Generator</title>

        <link rel="stylesheet" href="style.css">

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>

    <body>

        <div class="container">

            <h2>Password Generator</h2>

                <div class="display">

                    <input type="password" id="password" readonly>

                    <button id="showBtn">👁️</button>

                    <button id="copyBtn">📋</button>

                </div>

                <div class="category">

                    <button class="cat active" data-type="random">Random</button>

                    <button class="cat" data-type="pin">PIN</button>

                    <button class="cat" data-type="passphrase">Passphrase</button>

                </div>

                <div class="setting">

                    <label>Password Length</label>

                    <span id="lengthValue">12</span>

                </div>

                    <input type="range" min="4" max="30" value="12" id="length">

                <div class="options">

                    <label>

                        <input type="checkbox" id="uppercase" checked>
                        Uppercase (A-Z)

                    </label>

                    <label>

                        <input type="checkbox" id="lowercase" checked>
                        Lowercase (a-z)

                    </label>

                    <label>

                        <input type="checkbox" id="numbers" checked>
                        Numbers (0-9)

                    </label>

                    <label>

                        <input type="checkbox" id="symbols">
                        Symbols (!@#$%)

                    </label>

                    <label>

                        <input type="checkbox" id="excludeSimilar">
                        Exclude Similar Characters (I l 1 O 0)

                    </label>

                    <label>

                        <input type="checkbox" id="noRepeat">
                        No Repeated Characters

                    </label>

                </div>

                <div class="strength-box">

                    <div class="strength-bar" id="strengthBar"></div>

                </div>

                <p id="strengthText">Strength: Weak</p>

                <div class="stats">

                    <p>Uppercase : <span id="upperCount">0</span></p>

                    <p>Lowercase : <span id="lowerCount">0</span></p>

                    <p>Numbers : <span id="numberCount">0</span></p>

                    <p>Symbols : <span id="symbolCount">0</span></p>

                    <p>Length : <span id="lengthCount">0</span></p>

                    <p>Entropy : <span id="entropy">0 bits</span></p>

                </div>

                <div class="crack-box">

                    <h3>Estimated Crack Time</h3>

                    <p id="crackTime">Instantly</p>

                </div>

                <button id="generateBtn">Generate Password</button>

            <h2>Choose Theme</h2>

                <div class="themes">

                    <button class="theme light" data-theme="light"></button>

                    <button class="theme hacker" data-theme="hacker"></button>

                </div>

            <h3>Password History</h3>

                <ul id="historyList"></ul>

        </div>

        <div id="toast"></div>

        <script src="script.js"></script>

    </body>

</html>
